<!DOCTYPE html>
<html lang="en" ng-app="studentApp" ng-cloak>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Student CRUD</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="app.js"></script>
  <script src="auth-controller.js"></script>
</head>
<body ng-controller="RegisterController">
  <main class="card auth-card">
    <h1>Student Management</h1>
    <h2>Register</h2>
    <form ng-submit="register()">
      <label for="name">Full Name</label>
      <input id="name" type="text" ng-model="user.name" placeholder="Enter full name" required>
      <label for="email">Email</label>
      <input id="email" type="email" ng-model="user.email" placeholder="Enter email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" ng-model="user.password" placeholder="Minimum 8 characters" minlength="8" autocomplete="new-password" required>
      <button type="submit" ng-disabled="loading">{{ loading ? 'Registering...' : 'Register' }}</button>
    </form>
    <p class="message" ng-if="message" ng-bind="message" ng-class="{'error': isError}"></p>
    <p>Already registered? <a href="login.html">Login here</a></p>
  </main>
</body>
</html>
