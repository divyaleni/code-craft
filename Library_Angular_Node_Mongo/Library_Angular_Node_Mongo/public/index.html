<!DOCTYPE html>
<html lang="en" ng-app="libraryApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="app.js"></script>
</head>
<body ng-controller="LibraryController">
  <div class="container">
    <h1>Library Management</h1>

    <!-- Simple login page -->
    <div ng-if="!loggedIn" class="panel">
      <h2>Login Page</h2>
      <input type="text" ng-model="login.username" placeholder="Enter username">
      <input type="password" ng-model="login.password" placeholder="Enter password">
      <button ng-click="loginUser()">Login</button>
      <p class="message">{{loginMessage}}</p>
      <small>Demo login: student / 1234</small>
    </div>

    <!-- Library page -->
    <div ng-if="loggedIn">
      <p>Welcome, {{login.username}}! <button class="right" ng-click="logout()">Logout</button></p>

      <div class="panel">
        <h2>Add a Book</h2>
        <input type="text" ng-model="newBook.title" placeholder="Book title">
        <input type="text" ng-model="newBook.author" placeholder="Author name">
        <button ng-click="addBook()">Add Book</button>
      </div>

      <div class="panel">
        <h2>Book List</h2>
        <input type="text" ng-model="searchText" placeholder="Search book or author">
        <table>
          <thead>
            <tr>
              <th>Title</th><th>Author</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr ng-repeat="book in books | filter:searchText">
              <td>{{book.title}}</td>
              <td>{{book.author}}</td>
              <td>{{book.status}}</td>
              <td>
                <button ng-click="changeStatus(book)">
                  {{book.status === 'Available' ? 'Issue' : 'Return'}}
                </button>
                <button ng-click="deleteBook(book._id)">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
        <p>{{message}}</p>
      </div>
    </div>
  </div>
</body>
</html>
